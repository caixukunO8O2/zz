services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: xianzhi
      MYSQL_USER: xianzhi
      MYSQL_PASSWORD: xianzhi
      MYSQL_ROOT_PASSWORD: xianzhi-dev-root
    ports:
      - "3306:3306"
    volumes:
      - ../.data/mysql:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ../.data/redis:/data

  api:
    build:
      context: ../backend
    environment:
      APP_MODE: mock
      DATABASE_URL: mysql+aiomysql://xianzhi:xianzhi@mysql:3306/xianzhi
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
